<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS units</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <style>
        .unit-box {
            display: inline-block;
            height: 40px;
            margin: 10px;
            color: white;
            text-align: center;
            line-height: 40px;
            font-size: 14px;
        }

        .px { width: 100px; background: #4CAF50; }
        .in { width: 2in; background: #2196F3; }
        .cm { width: 5cm; background: #FF9800; }
        .mm { width: 50mm; background: #9C27B0; }
        .pt { width: 200pt; background: #E44336; }
        .pc { width: 15pc; background: #607D8B; }
    </style>
</head>
<body>

<h3>CSS Absolute Units Comparison</h3>

<div class="unit-box px">100px</div>
<div class="unit-box in">2in</div>
<div class="unit-box cm">5cm</div>
<div class="unit-box mm">50mm</div>
<div class="unit-box pt">200pt</div>
<div class="unit-box pc">15pc</div>

</body>
</html>
</body>
</html>
