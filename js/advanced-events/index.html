<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced event</title>
</head>

<body>
    <script>
        // keyboard event
        document.addEventListener("keydown", (e) => {
            console.log(e.key);
        });
    </script>
</body>

</html>
